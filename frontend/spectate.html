<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1A1A2E" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.socket.io https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
    font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
    connect-src 'self'
      ws://questionpourunchampion-backend.onrender.com
      wss://questionpourunchampion-backend.onrender.com
      https://questionpourunchampion-backend.onrender.com
      https://cdn.socket.io;
    img-src 'self' data: https://cdnjs.cloudflare.com;
  " />
  <title>Vue Spectateur - Question pour un Champion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ===================================================
       RESET & BASE
       =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1A1A2E;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* On mobile allow scroll */
    @media (max-width: 767px) {
      html, body {
        overflow: auto;
      }
    }

    /* ===================================================
       SCREEN STATES
       =================================================== */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* ===================================================
       WAITING SCREEN
       =================================================== */
    #screen-waiting {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1A1A2E;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }

    .waiting-tv-icon {
      font-size: 5rem;
      color: #00D4FF;
      animation: tvPulse 2s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.7), 0 0 60px rgba(0, 212, 255, 0.3);
    }

    @keyframes tvPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }

    .waiting-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .waiting-subtitle {
      font-size: 0.95rem;
      color: #6B8CAA;
    }

    .waiting-code-label {
      font-size: 0.85rem;
      color: #6B8CAA;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .waiting-code {
      font-family: 'Courier New', monospace;
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 0.3em;
      color: #00D4FF;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.8), 0 0 60px rgba(0, 212, 255, 0.4);
    }

    .waiting-spinner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #6B8CAA;
      font-size: 0.9rem;
    }

    .spinner-ring {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00D4FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===================================================
       GAME SCREEN — FULL VIEWPORT LAYOUT
       =================================================== */
    #screen-game {
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #1A1A2E;
    }

    @media (max-width: 767px) {
      #screen-game {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
    }

    /* ===================================================
       HEADER (70px)
       =================================================== */
    #game-header {
      flex-shrink: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 2px solid rgba(0, 212, 255, 0.25);
      backdrop-filter: blur(8px);
      gap: 1rem;
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #00D4FF;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
      white-space: nowrap;
      flex: 1;
    }

    .header-logo i {
      font-size: 1.3rem;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    #question-counter {
      font-size: 1rem;
      font-weight: 700;
      color: #A8C8E8;
      white-space: nowrap;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 100px;
      padding: 0.3rem 0.9rem;
    }

    /* Timer SVG */
    .timer-svg-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    #timer-svg {
      width: 52px;
      height: 52px;
      transform: rotate(-90deg);
    }

    #timer-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 4;
    }

    #timer-arc {
      fill: none;
      stroke: #00D4FF;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 263.9;
      stroke-dashoffset: 0;
      transition: stroke 0.4s;
    }

    #timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      color: #00D4FF;
      font-family: 'Courier New', monospace;
    }

    .header-spacer {
      flex: 1;
    }

    /* ===================================================
       QUESTION ZONE
       =================================================== */
    #question-zone {
      flex-shrink: 0;
      padding: 0.65rem 1.25rem 0.45rem;
      background: rgba(0, 10, 30, 0.6);
      border-bottom: 1px solid rgba(0, 212, 255, 0.12);
    }

    #question-text {
      font-size: clamp(1rem, 2.4vw, 1.4rem);
      font-weight: 700;
      color: #fff;
      text-align: center;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #correct-banner {
      display: none;
      margin-top: 0.5rem;
      padding: 0.45rem 1rem;
      background: rgba(0, 255, 136, 0.12);
      border: 1.5px solid #00FF88;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #00FF88;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    /* ===================================================
       OPTIONS COLUMNS
       =================================================== */
    #options-area {
      flex: 1;
      display: flex;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 767px) {
      #options-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: none;
        min-height: 320px;
        overflow: visible;
      }
    }

    .option-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0.5rem;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      transition: opacity 0.45s, box-shadow 0.45s;
    }

    .option-col:last-child {
      border-right: none;
    }

    /* Background tints per index */
    .option-col[data-idx="0"] { background: rgba(226, 27, 60, 0.16); }
    .option-col[data-idx="1"] { background: rgba(19, 104, 206, 0.16); }
    .option-col[data-idx="2"] { background: rgba(38, 137, 12, 0.16); }
    .option-col[data-idx="3"] { background: rgba(255, 166, 2, 0.16); }

    .option-col.correct-col {
      box-shadow: inset 0 0 0 3px #00FF88, 0 0 28px rgba(0, 255, 136, 0.35);
      background: rgba(0, 255, 136, 0.1) !important;
    }

    .option-col.wrong-col {
      opacity: 0.3;
    }

    .option-col.wrong-col .avatar-circle {
      filter: grayscale(100%);
    }

    /* Column header strip */
    .col-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      margin-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .option-col[data-idx="0"] .col-header { background: #E21B3C; }
    .option-col[data-idx="1"] .col-header { background: #1368CE; }
    .option-col[data-idx="2"] .col-header { background: #26890C; }
    .option-col[data-idx="3"] .col-header { background: #FFA602; }

    .col-icon {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .col-letter {
      font-size: 0.75rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    .col-text {
      font-size: clamp(0.68rem, 1.15vw, 0.88rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Correct checkmark overlay */
    .correct-check {
      display: none;
      font-size: 1.4rem;
      text-align: center;
      padding: 0.15rem 0;
      color: #00FF88;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.8);
    }

    .option-col.correct-col .correct-check {
      display: block;
    }

    /* Avatar container */
    .avatars-container {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.35rem;
      padding: 0.25rem;
      overflow: hidden;
    }

    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
      animation: avatarIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    @keyframes avatarIn {
      from { transform: scale(0) translateY(10px); opacity: 0; }
      to   { transform: scale(1) translateY(0);    opacity: 1; }
    }

    /* Proportional bar */
    .col-bar-wrap {
      flex-shrink: 0;
      padding: 0.3rem 0.5rem;
    }

    .col-bar-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .col-bar-fill {
      height: 100%;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .option-col[data-idx="0"] .col-bar-fill { background: #E21B3C; }
    .option-col[data-idx="1"] .col-bar-fill { background: #1368CE; }
    .option-col[data-idx="2"] .col-bar-fill { background: #26890C; }
    .option-col[data-idx="3"] .col-bar-fill { background: #FFA602; }

    .col-count-label {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: right;
      margin-top: 2px;
    }

    /* ===================================================
       PROGRESS BAR
       =================================================== */
    #progress-zone {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.45rem 1.25rem;
      background: rgba(0, 0, 0, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    #answers-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    #answers-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      background: linear-gradient(90deg, #00D4FF, #00FF88);
      transition: width 0.4s ease;
    }

    #answers-label {
      font-size: 0.82rem;
      color: #A8C8E8;
      white-space: nowrap;
      font-weight: 600;
    }

    /* ===================================================
       LEADERBOARD BAR (bottom)
       =================================================== */
    #leaderboard-bar {
      flex-shrink: 0;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      background: rgba(0, 0, 0, 0.55);
      border-top: 2px solid rgba(0, 212, 255, 0.2);
      overflow-x: auto;
      scrollbar-width: none;
    }

    #leaderboard-bar::-webkit-scrollbar {
      display: none;
    }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }

    .lb-item.lb-first {
      background: rgba(0, 212, 255, 0.12);
      border-color: #00D4FF;
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.25);
    }

    .lb-medal {
      font-size: 0.95rem;
      line-height: 1;
    }

    .lb-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-score {
      font-size: 0.82rem;
      font-weight: 800;
      color: #00D4FF;
      font-family: 'Courier New', monospace;
    }

    .lb-delta {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 100px;
      animation: deltaFade 2.2s ease forwards;
    }

    .lb-delta.positive {
      color: #00FF88;
      background: rgba(0, 255, 136, 0.15);
    }

    .lb-delta.negative {
      color: #FF3366;
      background: rgba(255, 51, 102, 0.15);
    }

    @keyframes deltaFade {
      0%, 65% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ===================================================
       HOST CONTROLS (floating, bottom-right)
       =================================================== */
    #host-controls {
      position: fixed;
      bottom: 78px;
      right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 200;
    }

    #host-controls.host-hidden {
      display: none;
    }

    .host-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    #btn-end-game {
      background: #E21B3C;
      color: #fff;
    }

    #btn-end-game:hover {
      background: #ff2244;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(226, 27, 60, 0.5);
    }

    #btn-next-question {
      background: #00D4FF;
      color: #000;
    }

    #btn-next-question:hover {
      background: #00EEFF;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
    }

    #btn-next-question.btn-hidden {
      display: none;
    }

    /* ===================================================
       FINAL SCREEN (podium + confetti)
       =================================================== */
    #screen-final {
      flex-direction: column;
      align-items: center;
      background: #1A1A2E;
      overflow-y: auto;
      padding: 2.5rem 1rem 7rem;
      position: relative;
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .final-title {
      position: relative;
      z-index: 10;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 900;
      color: #00D4FF;
      text-align: center;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.7);
      margin-bottom: 0.25rem;
    }

    .final-subtitle {
      position: relative;
      z-index: 10;
      font-size: 1rem;
      color: #6B8CAA;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Podium */
    .podium-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 620px;
    }

    /* slot order: left=2nd, center=1st, right=3rd */
    .podium-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 170px;
    }

    .podium-slot:nth-child(1) { animation: podRise 0.7s 0.3s ease both; }  /* 2nd */
    .podium-slot:nth-child(2) { animation: podRise 0.7s 0.05s ease both; } /* 1st */
    .podium-slot:nth-child(3) { animation: podRise 0.7s 0.5s ease both; }  /* 3rd */

    @keyframes podRise {
      from { transform: translateY(50px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .podium-crown {
      font-size: 1.6rem;
      animation: crownBob 2s ease-in-out infinite;
      margin-bottom: 0.2rem;
    }

    @keyframes crownBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    .podium-avatar-big {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.4rem;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
    }

    /* 1st place slot (center, child 2) gets bigger avatar */
    .podium-slot:nth-child(2) .podium-avatar-big {
      width: 66px;
      height: 66px;
      font-size: 1.6rem;
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.5);
    }

    .podium-name-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 0.2rem;
    }

    .podium-slot:nth-child(2) .podium-name-label {
      font-size: 1.05rem;
      color: #00D4FF;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
    }

    .podium-score-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00D4FF;
      margin-bottom: 0.4rem;
      font-family: 'Courier New', monospace;
    }

    .podium-slot:nth-child(2) .podium-score-label {
      font-size: 1.15rem;
    }

    .podium-block {
      width: 100%;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    /* 2nd */
    .podium-slot:nth-child(1) .podium-block {
      height: 70px;
      background: linear-gradient(180deg, rgba(168,168,200,0.25), rgba(168,168,200,0.05));
      border: 2px solid #A8A8C8;
      border-bottom: none;
    }

    /* 1st */
    .podium-slot:nth-child(2) .podium-block {
      height: 110px;
      background: linear-gradient(180deg, rgba(0,212,255,0.25), rgba(0,212,255,0.05));
      border: 2px solid #00D4FF;
      border-bottom: none;
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.3);
    }

    /* 3rd */
    .podium-slot:nth-child(3) .podium-block {
      height: 50px;
      background: linear-gradient(180deg, rgba(205,127,50,0.25), rgba(205,127,50,0.05));
      border: 2px solid #cd7f32;
      border-bottom: none;
    }

    /* Full rankings list (rank 4+) */
    .rankings-list {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
    }

    .rank-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .rank-pos {
      font-size: 0.9rem;
      color: #6B8CAA;
      width: 28px;
      text-align: center;
      font-weight: 700;
    }

    .rank-name {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .rank-score {
      font-size: 0.95rem;
      font-weight: 800;
      color: #00D4FF;
      font-family: 'Courier New', monospace;
    }

    /* New game button */
    .btn-new-game {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      background: #00D4FF;
      color: #000;
      border: none;
      border-radius: 100px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
    }

    .btn-new-game:hover {
      background: #00EEFF;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 212, 255, 0.55);
    }

    /* ===================================================
       NOTIFICATION TOAST
       =================================================== */
    #toast-container {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      padding: 0.65rem 1.1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      animation: toastIn 0.3s ease;
      pointer-events: none;
      max-width: 280px;
    }

    .toast.success { background: #00FF88; color: #000; }
    .toast.error   { background: #FF3366; color: #fff; }
    .toast.info    { background: #00D4FF; color: #000; }
    .toast.warning { background: #FFD700; color: #000; }

    @keyframes toastIn {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    @keyframes toastOut {
      from { transform: translateX(0);    opacity: 1; }
      to   { transform: translateX(110%); opacity: 0; }
    }

    /* ===================================================
       MOBILE RESPONSIVE
       =================================================== */
    @media (max-width: 767px) {
      .col-text {
        font-size: 0.7rem;
        -webkit-line-clamp: 3;
      }

      .avatar-circle {
        width: 28px;
        height: 28px;
        font-size: 0.7rem;
      }

      #question-text {
        font-size: 0.95rem;
      }

      #game-header {
        padding: 0 0.75rem;
        gap: 0.5rem;
      }

      .header-logo span {
        display: none;
      }

      #leaderboard-bar {
        height: 56px;
        gap: 0.4rem;
        padding: 0 0.6rem;
      }

      .lb-name {
        max-width: 55px;
      }

      #host-controls {
        bottom: 66px;
        right: 0.75rem;
      }

      .host-btn {
        font-size: 0.82rem;
        padding: 0.55rem 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- ================================================== -->
  <!-- SCREEN: WAITING                                     -->
  <!-- ================================================== -->
  <div id="screen-waiting" class="screen active">
    <i class="fas fa-tv waiting-tv-icon"></i>
    <div class="waiting-title">Vue Spectateur</div>
    <div class="waiting-subtitle">Connexion en cours...</div>
    <div class="waiting-code-label">Code de partie</div>
    <div class="waiting-code" id="display-code">----</div>
    <div class="waiting-spinner">
      <div class="spinner-ring"></div>
      <span>En attente de la partie...</span>
    </div>
  </div>

  <!-- ================================================== -->
  <!-- SCREEN: GAME                                        -->
  <!-- ================================================== -->
  <div id="screen-game" class="screen">

    <!-- HEADER -->
    <header id="game-header">
      <div class="header-logo">
        <i class="fas fa-question-circle"></i>
        <span>Question pour un Champion</span>
      </div>

      <div class="header-center">
        <div id="question-counter">Q ? / ?</div>
        <div class="timer-svg-wrap">
          <svg id="timer-svg" viewBox="0 0 100 100">
            <circle id="timer-track" cx="50" cy="50" r="42" />
            <circle id="timer-arc"   cx="50" cy="50" r="42" />
          </svg>
          <div id="timer-text">--</div>
        </div>
      </div>

      <div class="header-spacer"></div>
    </header>

    <!-- QUESTION ZONE -->
    <div id="question-zone">
      <div id="question-text">En attente de la premiere question...</div>
      <div id="correct-banner"></div>
    </div>

    <!-- OPTIONS COLUMNS (built by JS) -->
    <div id="options-area"></div>

    <!-- PROGRESS BAR -->
    <div id="progress-zone">
      <div id="answers-track">
        <div id="answers-fill"></div>
      </div>
      <div id="answers-label">0 / 0 ont repondu</div>
    </div>

    <!-- LEADERBOARD BAR -->
    <div id="leaderboard-bar"></div>

  </div>

  <!-- ================================================== -->
  <!-- SCREEN: FINAL                                       -->
  <!-- ================================================== -->
  <div id="screen-final" class="screen">
    <canvas id="confetti-canvas"></canvas>

    <div class="final-title">Partie terminee !</div>
    <div class="final-subtitle">Classement final</div>

    <!--
      Podium: visual order = 2nd (left) | 1st (center) | 3rd (right)
      DOM order matches visual order so flex align-items:flex-end works correctly.
    -->
    <div class="podium-wrap" id="podium-wrap">
      <!-- 2nd place -->
      <div class="podium-slot" id="pod-slot-2">
        <div class="podium-avatar-big" id="pod-avatar-2"></div>
        <div class="podium-name-label"  id="pod-name-2">---</div>
        <div class="podium-score-label" id="pod-score-2">0 pts</div>
        <div class="podium-block">&#x1F948;</div>
      </div>
      <!-- 1st place -->
      <div class="podium-slot" id="pod-slot-1">
        <div class="podium-crown">&#x1F451;</div>
        <div class="podium-avatar-big" id="pod-avatar-1"></div>
        <div class="podium-name-label"  id="pod-name-1">---</div>
        <div class="podium-score-label" id="pod-score-1">0 pts</div>
        <div class="podium-block">&#x1F947;</div>
      </div>
      <!-- 3rd place -->
      <div class="podium-slot" id="pod-slot-3">
        <div class="podium-avatar-big" id="pod-avatar-3"></div>
        <div class="podium-name-label"  id="pod-name-3">---</div>
        <div class="podium-score-label" id="pod-score-3">0 pts</div>
        <div class="podium-block">&#x1F949;</div>
      </div>
    </div>

    <!-- Rankings 4+ -->
    <div class="rankings-list" id="rankings-list"></div>

    <button class="btn-new-game" id="btn-new-game">
      <i class="fas fa-redo"></i> Nouvelle partie
    </button>
  </div>

  <!-- HOST CONTROLS (fixed floating) -->
  <div id="host-controls" class="host-hidden">
    <button class="host-btn" id="btn-next-question">
      &#10145;&#65039; Question suivante
    </button>
    <button class="host-btn" id="btn-end-game">
      &#9209;&#65039; Terminer la partie
    </button>
  </div>

  <!-- Socket.IO CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
  // ======================================================
  // SPECTATE.HTML — Logic
  // ======================================================

  const BACKEND_URL = 'https://questionpourunchampion-backend.onrender.com';

  // --- URL params ---
  const _params   = new URLSearchParams(window.location.search);
  const gameCode  = (_params.get('code') || '').toUpperCase();
  const isHost    = _params.get('host') === 'true';

  // --- App state ---
  let socket          = null;
  let players         = [];   // [{name, score, isHost}] — non-host players
  let prevScores      = {};   // name -> score before last question-results

  // Per-question option state
  let optionTextToIdx = {};   // option text -> column index (0-3)
  let optionCounts    = [0, 0, 0, 0];  // answers per column

  // Timer
  let timerInterval   = null;
  let timerTotal      = 1;

  // --- Constants ---
  const CIRCUMFERENCE   = 2 * Math.PI * 42;   // 263.9
  const OPTION_COLORS   = ['#E21B3C', '#1368CE', '#26890C', '#FFA602'];
  const OPTION_ICONS    = ['\u25b2', '\u25c6', '\u25cf', '\u25a0']; // ▲ ◆ ● ■
  const OPTION_LETTERS  = ['A', 'B', 'C', 'D'];
  const AVATAR_COLORS   = [
    '#E21B3C', '#1368CE', '#26890C', '#FFA602', '#9B59B6', '#E67E22'
  ];

  // ======================================================
  // UTILITIES
  // ======================================================

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function avatarColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) {
      h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  function toast(msg, type) {
    type = type || 'info';
    const box = document.getElementById('toast-container');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.animation = 'toastOut 0.3s ease forwards';
      setTimeout(function () { el.remove(); }, 320);
    }, 2800);
  }

  // ======================================================
  // BUILD OPTION COLUMNS
  // ======================================================

  function buildColumns() {
    const area = document.getElementById('options-area');
    area.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const col = document.createElement('div');
      col.className  = 'option-col';
      col.dataset.idx = i;
      col.innerHTML   = '<div class="col-header">'
        + '<span class="col-icon">' + OPTION_ICONS[i] + '</span>'
        + '<span class="col-letter">' + OPTION_LETTERS[i] + '</span>'
        + '<span class="col-text" id="col-text-' + i + '"></span>'
        + '</div>'
        + '<div class="correct-check" id="col-check-' + i + '">\u2705</div>'
        + '<div class="avatars-container" id="col-avatars-' + i + '"></div>'
        + '<div class="col-bar-wrap">'
        +   '<div class="col-bar-track">'
        +     '<div class="col-bar-fill" id="col-bar-' + i + '"></div>'
        +   '</div>'
        +   '<div class="col-count-label" id="col-count-' + i + '">0</div>'
        + '</div>';
      area.appendChild(col);
    }
  }

  // ======================================================
  // TIMER (SVG circle)
  // ======================================================

  function startTimer(limitMs) {
    stopTimer();
    const total   = Math.floor(limitMs / 1000);
    timerTotal    = total || 1;
    let remaining = total;

    const arc  = document.getElementById('timer-arc');
    const text = document.getElementById('timer-text');

    function render() {
      var frac   = remaining / timerTotal;
      var offset = CIRCUMFERENCE * (1 - frac);
      var urgent = remaining <= 5;
      var color  = urgent ? '#FF3366' : '#00D4FF';
      if (arc)  { arc.style.strokeDashoffset = offset; arc.style.stroke = color; }
      if (text) { text.textContent = remaining; text.style.color = color; }
    }

    render();
    timerInterval = setInterval(function () {
      remaining = Math.max(0, remaining - 1);
      render();
      if (remaining <= 0) stopTimer();
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  // ======================================================
  // PROGRESS BAR
  // ======================================================

  function updateProgress(answered, total) {
    var pct  = total > 0 ? Math.round((answered / total) * 100) : 0;
    var fill = document.getElementById('answers-fill');
    var lbl  = document.getElementById('answers-label');
    if (fill) fill.style.width = pct + '%';
    if (lbl)  lbl.textContent  = answered + ' / ' + total + ' ont repondu';
  }

  // ======================================================
  // LEADERBOARD
  // ======================================================

  function renderLeaderboard(rankList, showDeltas) {
    var bar = document.getElementById('leaderboard-bar');
    if (!bar) return;

    var sorted = rankList.slice().sort(function (a, b) {
      return (b.score || 0) - (a.score || 0);
    });
    var top8   = sorted.slice(0, 8);
    var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];

    bar.innerHTML = '';
    top8.forEach(function (p, i) {
      var delta    = showDeltas ? ((p.score || 0) - (prevScores[p.name] || 0)) : 0;
      var deltaHtml = '';
      if (showDeltas && delta !== 0) {
        var sign  = delta > 0 ? '+' : '';
        var cls   = delta > 0 ? 'positive' : 'negative';
        deltaHtml = '<span class="lb-delta ' + cls + '">' + sign + delta + '</span>';
      }
      var item = document.createElement('div');
      item.className = 'lb-item' + (i === 0 ? ' lb-first' : '');
      item.innerHTML  = '<span class="lb-medal">' + (medals[i] || '#' + (i + 1)) + '</span>'
        + '<span class="lb-name">'  + escHtml(p.name)       + '</span>'
        + '<span class="lb-score">' + (p.score || 0)        + '</span>'
        + deltaHtml;
      bar.appendChild(item);
    });

    // Save new scores for next delta calculation
    rankList.forEach(function (p) { prevScores[p.name] = p.score || 0; });
  }

  // ======================================================
  // RESET FOR NEW QUESTION
  // ======================================================

  function resetQuestion() {
    optionCounts = [0, 0, 0, 0];

    for (var i = 0; i < 4; i++) {
      var avs = document.getElementById('col-avatars-' + i);
      if (avs) avs.innerHTML = '';

      var bar = document.getElementById('col-bar-' + i);
      if (bar) bar.style.width = '0%';

      var cnt = document.getElementById('col-count-' + i);
      if (cnt) cnt.textContent = '0';

      var chk = document.getElementById('col-check-' + i);
      if (chk) chk.style.display = 'none';

      var col = document.querySelector('.option-col[data-idx="' + i + '"]');
      if (col) { col.classList.remove('correct-col', 'wrong-col'); col.style.opacity = ''; }
    }

    var banner = document.getElementById('correct-banner');
    if (banner) banner.style.display = 'none';
  }

  // ======================================================
  // HOST BUTTON VISIBILITY
  // ======================================================

  function showNextBtn()  {
    var b = document.getElementById('btn-next-question');
    if (b) b.classList.remove('btn-hidden');
  }

  function hideNextBtn() {
    var b = document.getElementById('btn-next-question');
    if (b) b.classList.add('btn-hidden');
  }

  // ======================================================
  // SOCKET EVENTS
  // ======================================================

  function connectSocket() {
    socket = io(BACKEND_URL, {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionDelay: 1000,
      timeout: 20000
    });

    socket.on('connect', function () {
      toast('Connecte !', 'success');

      if (isHost) {
        var hostName = 'Hote';
        try {
          var stored = sessionStorage.getItem('multiGameData');
          if (stored) {
            var d = JSON.parse(stored);
            hostName = d.hostName || 'Hote';
          }
        } catch (e) {}
        socket.emit('rejoin-as-host', { gameCode: gameCode, playerName: hostName });
      } else {
        socket.emit('spectate-join', { gameCode: gameCode });
      }
    });

    socket.on('disconnect', function () {
      toast('Connexion perdue...', 'warning');
    });

    // Host rejoined
    socket.on('rejoin-success', function (data) {
      players = (data.players || []).filter(function (p) { return !p.isHost; });
      renderLeaderboard(players, false);
      showScreen('screen-game');
    });

    // Spectator joined (non-host)
    socket.on('spectate-joined', function (data) {
      players = (data.players || []).filter(function (p) { return !p.isHost; });
      renderLeaderboard(players, false);
      showScreen('screen-game');
    });

    // Game started
    socket.on('game-started', function () {
      showScreen('screen-game');
      resetQuestion();
    });

    // New question
    socket.on('new-question', function (data) {
      handleNewQuestion(data);
    });

    // Player answered
    socket.on('player-answered', function (data) {
      handlePlayerAnswered(data);
    });

    // Question results
    socket.on('question-results', function (data) {
      handleQuestionResults(data);
    });

    // Game finished
    socket.on('game-finished', function (data) {
      handleGameFinished(data);
    });

    socket.on('error', function (data) {
      toast((data && data.message) ? data.message : 'Erreur', 'error');
    });
  }

  // ======================================================
  // GAME HANDLERS
  // ======================================================

  function handleNewQuestion(data) {
    showScreen('screen-game');
    hideNextBtn();
    stopTimer();
    resetQuestion();

    // Counter
    var counter = document.getElementById('question-counter');
    if (counter) {
      counter.textContent = 'Q ' + data.questionNumber + ' / ' + data.totalQuestions;
    }

    // Question text
    var qText = document.getElementById('question-text');
    if (qText) qText.textContent = data.question || '';

    // Option labels
    var options = data.options || [];
    optionTextToIdx = {};
    for (var i = 0; i < 4; i++) {
      var txt    = options[i] || '';
      var colTxt = document.getElementById('col-text-' + i);
      if (colTxt) colTxt.textContent = txt;
      optionTextToIdx[txt] = i;
    }

    // Progress
    var total = (players.length) || (data.totalPlayers || 0);
    updateProgress(0, total);

    // Start timer
    startTimer(data.timeLimit || 30000);
  }

  function handlePlayerAnswered(data) {
    // data: { playerId, playerName, answer, totalAnswered, totalPlayers }
    var idx = optionTextToIdx[data.answer];
    if (idx !== undefined && idx !== null) {
      addAvatar(idx, data.playerName);
      optionCounts[idx]++;

      var cnt = document.getElementById('col-count-' + idx);
      if (cnt) cnt.textContent = optionCounts[idx];
    }
    updateProgress(data.totalAnswered, data.totalPlayers);
  }

  function handleQuestionResults(data) {
    stopTimer();

    var correct    = data.correctAnswer || '';
    var correctIdx = optionTextToIdx[correct];

    // Tally counts from answers array for accurate bars
    var countByIdx = [0, 0, 0, 0];
    if (data.answers) {
      data.answers.forEach(function (a) {
        var idx = optionTextToIdx[a.answer];
        if (idx !== undefined) countByIdx[idx]++;
      });
    }
    var maxCount = Math.max(1, countByIdx[0], countByIdx[1], countByIdx[2], countByIdx[3]);

    for (var i = 0; i < 4; i++) {
      var col = document.querySelector('.option-col[data-idx="' + i + '"]');
      if (!col) continue;

      if (i === correctIdx) {
        col.classList.add('correct-col');
        var chk = document.getElementById('col-check-' + i);
        if (chk) chk.style.display = 'block';
      } else {
        col.classList.add('wrong-col');
      }

      var bar = document.getElementById('col-bar-' + i);
      if (bar) bar.style.width = ((countByIdx[i] / maxCount) * 100) + '%';

      var cnt = document.getElementById('col-count-' + i);
      if (cnt) cnt.textContent = countByIdx[i];
    }

    // Correct banner
    var banner = document.getElementById('correct-banner');
    if (banner) {
      banner.style.display = 'block';
      banner.textContent   = '\u2705 Bonne reponse : ' + correct;
    }

    // Update leaderboard with deltas
    var rankings = (data.rankings || []).filter(function (p) { return !p.isHost; });
    renderLeaderboard(rankings, true);
    players = rankings;

    // Host: show next question button
    if (isHost) showNextBtn();
  }

  function handleGameFinished(data) {
    stopTimer();
    var rankings = (data.rankings || []).filter(function (p) { return !p.isHost; });
    renderFinalScreen(rankings);
    showScreen('screen-final');
    startConfetti();
  }

  // ======================================================
  // ADD AVATAR TO COLUMN
  // ======================================================

  function addAvatar(idx, playerName) {
    var container = document.getElementById('col-avatars-' + idx);
    if (!container) return;
    var circle = document.createElement('div');
    circle.className     = 'avatar-circle';
    circle.style.background = avatarColor(playerName);
    circle.textContent   = playerName.charAt(0).toUpperCase();
    circle.title         = playerName;
    container.appendChild(circle);
  }

  // ======================================================
  // FINAL SCREEN
  // ======================================================

  function renderFinalScreen(rankings) {
    // Podium: visual DOM order is 2nd | 1st | 3rd
    var podMap = [
      { domSuffix: '2', rankIdx: 1 },
      { domSuffix: '1', rankIdx: 0 },
      { domSuffix: '3', rankIdx: 2 },
    ];

    podMap.forEach(function (pm) {
      var player  = rankings[pm.rankIdx];
      var slotEl  = document.getElementById('pod-slot-' + pm.domSuffix);
      var nameEl  = document.getElementById('pod-name-'   + pm.domSuffix);
      var scoreEl = document.getElementById('pod-score-'  + pm.domSuffix);
      var avEl    = document.getElementById('pod-avatar-' + pm.domSuffix);

      if (!player) {
        if (slotEl) slotEl.style.visibility = 'hidden';
        return;
      }
      if (slotEl) slotEl.style.visibility = 'visible';
      if (nameEl)  nameEl.textContent  = player.name;
      if (scoreEl) scoreEl.textContent = (player.score || 0) + ' pts';
      if (avEl) {
        avEl.style.background = avatarColor(player.name);
        avEl.textContent      = player.name.charAt(0).toUpperCase();
      }
    });

    // Rank 4+
    var list = document.getElementById('rankings-list');
    if (list) {
      list.innerHTML = '';
      rankings.slice(3).forEach(function (p, i) {
        var row = document.createElement('div');
        row.className = 'rank-row';
        row.innerHTML = '<span class="rank-pos">#' + (i + 4) + '</span>'
          + '<span class="rank-name">' + escHtml(p.name) + '</span>'
          + '<span class="rank-score">' + (p.score || 0) + ' pts</span>';
        list.appendChild(row);
      });
    }
  }

  // ======================================================
  // CONFETTI (CSS Canvas)
  // ======================================================

  function startConfetti() {
    var canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    var colors = [
      '#E21B3C', '#1368CE', '#26890C', '#FFA602',
      '#00D4FF', '#FF00AA', '#00FF88', '#FFD700'
    ];

    var particles = [];
    for (var n = 0; n < 150; n++) {
      particles.push({
        x:    Math.random() * canvas.width,
        y:    (Math.random() * canvas.height) - canvas.height,
        w:    7 + Math.random() * 8,
        h:    4 + Math.random() * 5,
        col:  colors[Math.floor(Math.random() * colors.length)],
        vy:   2.2 + Math.random() * 3,
        vx:   (Math.random() - 0.5) * 2.5,
        rot:  Math.random() * 360,
        rotV: (Math.random() - 0.5) * 4
      });
    }

    var frame;
    var age    = 0;
    var active = true;

    function draw() {
      if (!active) return;
      age++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var globalAlpha = age > 250 ? Math.max(0, 1 - (age - 250) / 110) : 1;

      particles.forEach(function (c) {
        c.y   += c.vy;
        c.x   += c.vx;
        c.rot += c.rotV;
        if (c.y > canvas.height + 20) {
          c.y = -20;
          c.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rot * Math.PI) / 180);
        ctx.globalAlpha  = globalAlpha;
        ctx.fillStyle    = c.col;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      });

      if (age < 380) {
        frame = requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        active = false;
      }
    }

    draw();
  }

  // ======================================================
  // ENTRY POINT
  // ======================================================

  document.addEventListener('DOMContentLoaded', function () {
    // Show code in waiting screen
    var displayCode = document.getElementById('display-code');
    if (displayCode) displayCode.textContent = gameCode || '----';

    if (!gameCode) {
      toast('Code de partie manquant dans l\'URL (?code=XXXX)', 'error');
      return;
    }

    // Host controls visibility
    var hostControls = document.getElementById('host-controls');
    if (isHost && hostControls) {
      hostControls.classList.remove('host-hidden');
    }

    // Hide next-question button initially
    hideNextBtn();

    // Build option columns
    buildColumns();

    // Buttons
    document.getElementById('btn-end-game').addEventListener('click', function () {
      if (confirm('Voulez-vous vraiment terminer la partie ?')) {
        if (socket) socket.emit('end-game', { gameCode: gameCode });
      }
    });

    document.getElementById('btn-next-question').addEventListener('click', function () {
      if (socket) socket.emit('next-question', { gameCode: gameCode });
      hideNextBtn();
    });

    document.getElementById('btn-new-game').addEventListener('click', function () {
      sessionStorage.removeItem('multiGameData');
      window.location.href = 'multijoueur.html';
    });

    // Connect
    connectSocket();
  });
  </script>
</body>
</html>
